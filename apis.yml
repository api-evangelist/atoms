aid: atoms
name: Atoms
description: >-
  Atoms is a direct-to-consumer footwear brand founded in 2019 by Waqas Ali and
  Sidra Qasim and headquartered in the Brooklyn Navy Yard, New York. The company
  designs, develops, and sells minimalist everyday sneakers - notably its Model
  000 and Model 001 lines - and differentiates itself with quarter-size sizing
  and the ability to buy a pair in two different sizes for each foot. Product
  features include lightweight foam cushioning, a copper-infused antimicrobial
  lining, stretch slip-on laces, and an 8mm heel-to-toe drop. Atoms sells online
  via a Shopify storefront and is backed by Initialized Capital, Kleiner Perkins,
  DST Global, and Serena Ventures. It has no public developer API program; this
  API Evangelist profile captures its company identity, web properties, and
  domain-security posture.
